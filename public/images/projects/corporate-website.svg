      <rect x="370" y="0" width="170" height="115" rx="8" fill="#111827" stroke="#1E293B"/>
      <circle cx="396" cy="26" r="12" fill="#10B981" opacity="0.2"/>
      <rect x="416" y="22" width="70" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="386" y="50" width="138" height="6" rx="3" fill="#64748B"/>
      <rect x="386" y="62" width="118" height="6" rx="3" fill="#64748B"/>
      <rect x="386" y="80" width="55" height="14" rx="4" fill="#1E293B"/>
