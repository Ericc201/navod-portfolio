      <rect x="231" y="22" width="70" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="201" y="50" width="138" height="6" rx="3" fill="#64748B"/>
      <rect x="201" y="62" width="118" height="6" rx="3" fill="#64748B"/>
      <rect x="201" y="80" width="55" height="14" rx="4" fill="#1E293B"/>

