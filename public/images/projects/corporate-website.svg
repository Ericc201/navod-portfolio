<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="corpBg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="heroGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#corpBg)"/>

  <!-- Browser Window -->
  <g transform="translate(100, 50)">
    <rect width="600" height="400" rx="14" fill="#0B0F19" stroke="#334155" stroke-width="2"/>
    
    <!-- Title bar -->
    <rect width="600" height="42" rx="14" fill="#1E293B"/>
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>
    <rect x="130" y="11" width="340" height="20" rx="6" fill="#0B0F19" stroke="#334155"/>
    <rect x="145" y="18" width="130" height="6" rx="3" fill="#64748B"/>

    <!-- Navbar inside preview -->
    <rect x="30" y="60" width="540" height="38" rx="6" fill="#0F172A" stroke="#1E293B"/>
    <rect x="46" y="74" width="75" height="10" rx="3" fill="url(#brandGrad)"/>
    <rect x="220" y="76" width="45" height="6" rx="3" fill="#94A3B8"/>
    <rect x="280" y="76" width="45" height="6" rx="3" fill="#94A3B8"/>
    <rect x="340" y="76" width="45" height="6" rx="3" fill="#94A3B8"/>
    <rect x="400" y="76" width="45" height="6" rx="3" fill="#94A3B8"/>
    <rect x="480" y="70" width="75" height="18" rx="6" fill="#0284C7"/>

    <!-- Hero Section -->
    <rect x="30" y="110" width="540" height="140" rx="10" fill="url(#heroGradient)" stroke="#1E293B"/>
    <rect x="55" y="135" width="230" height="18" rx="4" fill="#FFFFFF"/>
    <rect x="55" y="162" width="270" height="8" rx="4" fill="#94A3B8"/>
    <rect x="55" y="176" width="210" height="8" rx="4" fill="#64748B"/>
    <rect x="55" y="196" width="90" height="24" rx="8" fill="url(#brandGrad)"/>
    <rect x="155" y="196" width="80" height="24" rx="8" fill="#1E293B" stroke="#334155"/>
    
    <!-- Hero graphic / illustration -->
    <rect x="370" y="125" width="180" height="110" rx="10" fill="#0F172A" stroke="#334155"/>
    <circle cx="460" cy="175" r="30" fill="#0284C7" opacity="0.2"/>
    <path d="M430 185L455 160L475 178L495 150" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Services / Feature Grid -->
    <g transform="translate(30, 262)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="170" height="115" rx="8" fill="#111827" stroke="#1E293B"/>
      <circle cx="26" cy="26" r="12" fill="#0284C7" opacity="0.2"/>
      <rect x="46" y="22" width="70" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="16" y="50" width="138" height="6" rx="3" fill="#64748B"/>
      <rect x="16" y="62" width="118" height="6" rx="3" fill="#64748B"/>
      <rect x="16" y="80" width="55" height="14" rx="4" fill="#1E293B"/>

      <!-- Item 2 -->
