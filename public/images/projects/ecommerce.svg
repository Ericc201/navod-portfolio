<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="ecomBg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D16"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ecomCard" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#ecomBg)"/>

  <!-- Browser Frame -->
  <g transform="translate(100, 50)">
    <!-- Browser window -->
    <rect width="600" height="400" rx="14" fill="#0B0F19" stroke="#334155" stroke-width="2"/>
    
    <!-- Title bar -->
    <rect width="600" height="42" rx="14" fill="#1E293B"/>
    <circle cx="24" cy="21" r="5" fill="#EF4444"/>
    <circle cx="40" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="56" cy="21" r="5" fill="#10B981"/>
    
    <!-- Search / URL bar -->
    <rect x="120" y="10" width="360" height="22" rx="6" fill="#0B0F19" stroke="#334155"/>
    <rect x="135" y="18" width="140" height="6" rx="3" fill="#64748B"/>
    
    <!-- Header inside web app -->
    <rect x="30" y="60" width="540" height="40" rx="8" fill="#1E293B" stroke="#334155" stroke-width="0.5"/>
    <rect x="46" y="74" width="70" height="12" rx="3" fill="#38BDF8"/>
    <rect x="180" y="77" width="50" height="6" rx="3" fill="#94A3B8"/>
    <rect x="250" y="77" width="50" height="6" rx="3" fill="#94A3B8"/>
    <rect x="320" y="77" width="50" height="6" rx="3" fill="#94A3B8"/>
    <circle cx="530" cy="80" r="12" fill="#0284C7" opacity="0.3"/>
    <circle cx="546" cy="80" r="12" fill="#334155"/>

    <!-- Hero Promo Banner -->
    <rect x="30" y="112" width="540" height="90" rx="10" fill="url(#ecomCard)" stroke="#334155"/>
    <rect x="55" y="135" width="180" height="14" rx="4" fill="#FFFFFF"/>
    <rect x="55" y="156" width="220" height="8" rx="4" fill="#94A3B8"/>
    <rect x="55" y="172" width="75" height="18" rx="6" fill="url(#blueGlow)"/>
    <circle cx="470" cy="157" r="30" fill="#38BDF8" opacity="0.1"/>

    <!-- Product Grid: 3 cards -->
    <!-- Card 1 -->
    <g transform="translate(30, 218)">
      <rect width="168" height="160" rx="10" fill="url(#ecomCard)" stroke="#334155"/>
      <rect x="14" y="14" width="140" height="80" rx="6" fill="#0F172A"/>
      <circle cx="84" cy="54" r="22" fill="#334155"/>
      <rect x="14" y="104" width="85" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="14" y="118" width="50" height="6" rx="3" fill="#64748B"/>
      <rect x="14" y="134" width="45" height="10" rx="3" fill="#38BDF8"/>
      <rect x="110" y="128" width="44" height="20" rx="6" fill="#0284C7"/>
    </g>

    <!-- Card 2 -->
    <g transform="translate(216, 218)">
      <rect width="168" height="160" rx="10" fill="url(#ecomCard)" stroke="#334155"/>
      <rect x="14" y="14" width="140" height="80" rx="6" fill="#0F172A"/>
      <circle cx="84" cy="54" r="22" fill="#1E293B"/>
      <rect x="14" y="104" width="95" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="14" y="118" width="60" height="6" rx="3" fill="#64748B"/>
      <rect x="14" y="134" width="40" height="10" rx="3" fill="#38BDF8"/>
      <rect x="110" y="128" width="44" height="20" rx="6" fill="#0284C7"/>
    </g>

    <!-- Card 3 -->
    <g transform="translate(402, 218)">
      <rect width="168" height="160" rx="10" fill="url(#ecomCard)" stroke="#334155"/>
      <rect x="14" y="14" width="140" height="80" rx="6" fill="#0F172A"/>
      <circle cx="84" cy="54" r="22" fill="#334155"/>
      <rect x="14" y="104" width="90" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="14" y="118" width="55" height="6" rx="3" fill="#64748B"/>
      <rect x="14" y="134" width="48" height="10" rx="3" fill="#38BDF8"/>
      <rect x="110" y="128" width="44" height="20" rx="6" fill="#0284C7"/>
    </g>
  </g>
</svg>

