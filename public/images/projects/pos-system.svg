<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="scannerGlow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle Grid lines -->
  <g opacity="0.1" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Glow blob -->
  <circle cx="400" cy="240" r="140" fill="#0284C7" opacity="0.15" filter="blur(50px)"/>

  <!-- Mobile Device Frame -->
  <rect x="270" y="50" width="260" height="400" rx="36" fill="#111827" stroke="#334155" stroke-width="4"/>
  <rect x="280" y="62" width="240" height="376" rx="28" fill="#090D16"/>
  
  <!-- Camera notch -->
  <rect x="360" y="72" width="80" height="14" rx="7" fill="#1E293B"/>

  <!-- App Header -->
  <rect x="295" y="100" width="210" height="44" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
  <circle cx="315" cy="122" r="8" fill="#38BDF8"/>
  <rect x="333" y="115" width="80" height="7" rx="3.5" fill="#E2E8F0"/>
  <rect x="333" y="126" width="50" height="5" rx="2.5" fill="#64748B"/>
  <circle cx="485" cy="122" r="7" fill="#334155"/>

  <!-- Barcode Scanner Area -->
  <rect x="295" y="156" width="210" height="100" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="310" y="170" width="180" height="2" fill="#38BDF8" opacity="0.8"/>
  <rect x="310" y="172" width="180" height="30" fill="url(#scannerGlow)"/>
  
  <!-- Barcode Lines -->
  <g fill="#94A3B8" opacity="0.7">
    <rect x="340" y="185" width="4" height="40" rx="2"/>
    <rect x="348" y="185" width="8" height="40" rx="2"/>
    <rect x="360" y="185" width="3" height="40" rx="1.5"/>
    <rect x="367" y="185" width="6" height="40" rx="2"/>
    <rect x="377" y="185" width="10" height="40" rx="2"/>
    <rect x="391" y="185" width="4" height="40" rx="2"/>
    <rect x="399" y="185" width="7" height="40" rx="2"/>
    <rect x="410" y="185" width="3" height="40" rx="1.5"/>
    <rect x="417" y="185" width="9" height="40" rx="2"/>
    <rect x="430" y="185" width="4" height="40" rx="2"/>
  </g>

  <!-- Cart / Item Card -->
  <rect x="295" y="268" width="210" height="60" rx="10" fill="url(#cardGrad)" stroke="#1E293B"/>
  <rect x="307" y="280" width="36" height="36" rx="8" fill="#1E293B"/>
  <rect x="352" y="283" width="75" height="7" rx="3.5" fill="#E2E8F0"/>
  <rect x="352" y="295" width="45" height="5" rx="2.5" fill="#64748B"/>
  <rect x="352" y="305" width="30" height="5" rx="2.5" fill="#38BDF8"/>
  <rect x="450" y="286" width="42" height="24" rx="6" fill="#0284C7" opacity="0.3"/>
  <rect x="458" y="295" width="26" height="6" rx="3" fill="#38BDF8"/>

  <!-- Total & Checkout Button -->
  <rect x="295" y="340" width="210" height="70" rx="12" fill="#0B132B" stroke="#1E293B"/>
  <rect x="310" y="352" width="50" height="6" rx="3" fill="#64748B"/>
  <rect x="440" y="350" width="52" height="8" rx="4" fill="#E2E8F0"/>
  
  <rect x="310" y="372" width="180" height="28" rx="8" fill="url(#accent)"/>
  <rect x="370" y="382" width="60" height="8" rx="4" fill="#FFFFFF"/>

  <!-- Left Floating Stat Card -->
  <g transform="translate(90, 160)">
    <rect width="150" height="90" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1" opacity="0.95"/>
    <circle cx="28" cy="30" r="14" fill="#0284C7" opacity="0.2"/>
    <path d="M24 30L27 33L33 26" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
    <rect x="52" y="22" width="75" height="7" rx="3.5" fill="#94A3B8"/>
    <rect x="52" y="33" width="50" height="5" rx="2.5" fill="#64748B"/>
    <rect x="20" y="55" width="110" height="18" rx="6" fill="#1E293B"/>
    <rect x="28" y="61" width="60" height="6" rx="3" fill="#38BDF8"/>
  </g>

  <!-- Right Floating Report Card -->
  <g transform="translate(560, 230)">
    <rect width="155" height="96" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1" opacity="0.95"/>
    <rect x="18" y="18" width="60" height="7" rx="3.5" fill="#E2E8F0"/>
    <rect x="18" y="30" width="40" height="5" rx="2.5" fill="#64748B"/>
    
    <!-- Mini Bar Chart -->
    <rect x="20" y="65" width="14" height="15" rx="3" fill="#334155"/>
    <rect x="42" y="55" width="14" height="25" rx="3" fill="#0284C7"/>
    <rect x="64" y="45" width="14" height="35" rx="3" fill="#38BDF8"/>
    <rect x="86" y="52" width="14" height="28" rx="3" fill="#0284C7"/>
    <rect x="108" y="40" width="14" height="40" rx="3" fill="#38BDF8"/>
  </g>
</svg>
